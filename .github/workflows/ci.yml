name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Unit and API tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check JavaScript syntax
        run: |
          node --check src/basesentinel/static/js/dashboard.js
          node --check src/basesentinel/static/js/alerts.js
          node --check src/basesentinel/static/js/agents.js
          node --check src/basesentinel/static/js/events.js
          node --check src/basesentinel/static/js/event-detail.js

      - name: Run tests
        run: python -m pytest -q tests --ignore=tests/integration
