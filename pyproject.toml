[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "basesentinel"
version = "0.1.0"
description = "Local network security and monitoring platform"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1",
    "Flask-SQLAlchemy>=3.1",
    "Flask-Migrate>=4.0",
    "PyMySQL>=1.1",
    "python-dotenv>=1.0",
    "pystray>=0.19.5",
    "Pillow>=10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[project.scripts]
basesentinel-agent = "basesentinel_agent.cli:main"

[project.gui-scripts]
basesentinel-agent-gui = "basesentinel_agent.gui:main"
basesentinel-agent-tray = "basesentinel_agent.tray:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]